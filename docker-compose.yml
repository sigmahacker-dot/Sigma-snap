# SIGMA SNAP — local infrastructure (run on your own machine; docker is not on the build VM)
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigmasnap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigmasnap
      POSTGRES_PASSWORD: sigmasnap
      POSTGRES_DB: sigmasnap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigmasnap"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sigmasnap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sigmasnap-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sigmasnap
      MINIO_ROOT_PASSWORD: sigmasnap123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
